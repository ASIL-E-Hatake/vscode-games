# Ruby のチートシート。各 code は単独で実行できる形にする（npm run test:snippets で検証。Ruby が無い環境ではスキップ）
version: 1
id: ruby
name: Ruby
kind: language
order: 4
version_note: Ruby 3.2 以降
docs: https://docs.ruby-lang.org/ja/
topics:
  - id: basics
    items:
      - title: 画面に出力する
        code: |
          puts "Hello, World!"   # 改行あり
          print "改行なし\n"
          p [1, "a"]              # 中身を確認しやすい形で出力（デバッグ用）
          name = "太郎"
          age = 20
          puts "#{name} は #{age} 歳" # 式の埋め込みはダブルクォートのときだけ
      - title: コメント
        code: |
          # 1 行コメント
          =begin
          複数行のコメント
          （行の先頭に書く必要がある）
          =end
      - title: メソッド呼び出しの括弧は省略できる
        code: |
          puts("括弧あり")
          puts "括弧なし"
        note: 引数があるときは括弧を付けるなど、チームのルールに合わせる。

  - id: variables
    items:
      - title: 変数（型の宣言は不要）
        code: |
          age = 20
          price = 1980.5
          member = true
          name = "太郎"
          nothing = nil      # 値が無いことを表す
          puts age.class     # Integer
      - title: 定数（大文字で始まる名前）
        code: |
          MAX_SIZE = 100
          # 再代入すると警告が出る
      - title: 型の変換
        code: |
          n = "123".to_i     # 文字列 → 整数
          f = "3.14".to_f
          s = 456.to_s       # 数値 → 文字列
          puts 7 / 2         # 3（整数同士の割り算は切り捨て）
          puts 7 / 2.0       # 3.5
          puts 7 % 2         # 1（余り）
        note: to_i は変換できない文字列でもエラーにならず 0 になる（"abc".to_i は 0）。エラーにしたいときは Integer("abc")。
      - title: シンボル
        code: |
          status = :active   # 名前を表す軽い値。ハッシュのキーによく使う
          puts status == :active

  - id: conditionals
    items:
      - title: if / elsif / else
        code: |
          score = 75
          if score >= 80
            puts "合格"
          elsif score >= 60
            puts "追試"
          else
            puts "不合格"
          end
        note: else if ではなく elsif と書く。
      - title: 比較・論理演算子・後置 if
        code: |
          a = 5
          b = 3
          puts a == b, a != b
          puts a > 0 && b > 0, a > 0 || b > 0, !(a > 0)
          puts "正の数" if a > 0      # 1 行で書ける
          puts "0 以下" unless a > 0  # unless は「〜でなければ」
      - title: 偽になるのは false と nil だけ
        code: |
          puts "0 は真" if 0
          puts "空文字も真" if ""
          value = nil
          puts "nil は偽" unless value
      - title: case / when
        code: |
          day = "SAT"
          type = case day
                 when "SAT", "SUN" then "休日"
                 else "平日"
                 end
          puts type
      - title: 三項演算子
        code: |
          age = 20
          label = age >= 20 ? "大人" : "子ども"

  - id: loops
    items:
      - title: 回数を決めて繰り返す
        code: |
          5.times { |i| puts i }      # 0〜4
          1.upto(3) { |i| puts i }    # 1〜3
          (1..10).step(2) { |i| puts i } # 1, 3, 5, 7, 9
      - title: 配列の要素を順に処理する（each）
        code: |
          fruits = ["apple", "banana"]
          fruits.each do |fruit|
            puts fruit
          end
          fruits.each_with_index { |fruit, i| puts "#{i}: #{fruit}" }
        note: Ruby では for 文より each を使うのが一般的。
      - title: while 文
        code: |
          count = 0
          while count < 3
            count += 1   # Ruby に ++ は無い
          end
      - title: next と break
        code: |
          (0...10).each do |i|
            next if i == 2   # 2 を飛ばして次へ（continue に相当）
            break if i == 5  # 5 でループを抜ける
            puts i
          end

  - id: functions
    items:
      - title: メソッドの定義と呼び出し
        code: |
          def add(a, b)
            a + b # 最後に評価した値が戻り値になる（return は省略できる）
          end

          puts add(2, 3) # 5
      - title: 引数の既定値・キーワード引数
        code: |
          def greet(name, greeting: "こんにちは")
            "#{greeting}、#{name}"
          end

          puts greet("太郎")
          puts greet("花子", greeting: "おはよう")
      - title: ブロックを受け取るメソッド
        code: |
          def twice
            yield
            yield
          end

          twice { puts "呼ばれた" }
      - title: 名前の慣習（? と !）
        code: |
          puts [].empty?        # ? で終わるメソッドは真偽値を返す
          name = "ruby"
          name.upcase!          # ! で終わるメソッドは元の値を書き換えるなど注意が必要
          puts name             # "RUBY"

  - id: collections
    items:
      - title: 配列
        code: |
          fruits = ["apple", "banana"]
          fruits << "cherry"           # 末尾に追加（push と同じ）
          first = fruits[0]
          last = fruits[-1]            # 後ろから数える
          part = fruits[0, 2]          # 0 番目から 2 個
          puts fruits.size
          puts fruits.include?("banana")
          fruits.delete("apple")
      - title: 変換・絞り込み・集計
        code: |
          nums = [5, 2, 8, 1]
          p nums.map { |n| n * 2 }
          p nums.select { |n| n > 3 }   # 条件に合うものだけ
          p nums.sum
          p nums.sort
          p nums.sort.reverse
      - title: ハッシュ（キーと値の組）
        code: |
          stock = { apple: 3, banana: 5 }  # キーがシンボルの書き方
          stock[:melon] = 1
          puts stock[:apple]
          puts stock.fetch(:grape, 0)      # 無いときの値を指定
          stock.each do |key, value|
            puts "#{key}: #{value}"
          end
        note: '{ apple: 3 } と { "apple" => 3 } はキーの種類（シンボルと文字列）が違うので、stock[:apple] と stock["apple"] は別物。'
      - title: 範囲（Range）
        code: |
          p (1..5).to_a    # [1, 2, 3, 4, 5]（.. は終わりを含む）
          p (1...5).to_a   # [1, 2, 3, 4]（... は終わりを含まない）

  - id: strings
    items:
      - title: 連結・長さ・部分文字列
        code: |
          s = "Hello" + ", " + "World"
          puts s.length      # 12
          puts s[0, 5]       # "Hello"
          puts s[-5..]       # "World"
          puts "ab" * 3      # "ababab"
      - title: 検索・置換・分割・結合
        code: |
          s = "a,b,c"
          puts s.include?("b")     # true
          p s.index("c")           # 4（無ければ nil）
          puts s.gsub(",", "-")    # "a-b-c"（sub は最初の 1 つだけ）
          parts = s.split(",")     # ["a", "b", "c"]
          puts parts.join("/")     # "a/b/c"
      - title: 書式・変換
        code: |
          name = "花子"
          score = 95.5
          puts format("%s さんは %.1f 点", name, score)
          puts "ruby".upcase       # "RUBY"
          puts "  hi  ".strip      # "hi"
          puts "".empty?           # true
      - title: シングルクォートとダブルクォート
        code: |
          name = "太郎"
          puts 'こんにちは、#{name}\n'  # そのまま表示される
          puts "こんにちは、#{name}"    # 埋め込み・\n などが使える

  - id: exceptions
    items:
      - title: begin / rescue / ensure
        code: |
          begin
            n = Integer("abc")
          rescue ArgumentError => e
            puts "数値ではありません: #{e.message}"
          else
            puts "例外が起きなかったときだけ実行される"
          ensure
            puts "必ず実行される"
          end
      - title: 例外を発生させる
        code: |
          def withdraw(amount)
            raise ArgumentError, "金額は 1 以上にしてください" if amount <= 0
          end

          begin
            withdraw(0)
          rescue ArgumentError => e
            puts e.message
          end
      - title: メソッド全体で例外を受ける
        code: |
          def parse(text)
            Integer(text)
          rescue ArgumentError
            nil
          end

          p parse("12"), parse("x")  # 12, nil
        note: rescue => e のように種類を指定しないと StandardError をすべて受ける。必要な例外だけを書く。

  - id: file-io
    items:
      - title: ファイルに書き込む・読み込む
        code: |
          File.write("sample.txt", "1行目\n2行目\n")
          text = File.read("sample.txt", encoding: "UTF-8")
          puts text
      - title: 1 行ずつ読む・追記する
        code: |
          File.write("lines.txt", "a\nb\n")
          File.open("lines.txt", "a") { |f| f.puts "c" }  # "a" は追記
          File.foreach("lines.txt") do |line|
            puts line.chomp   # chomp で末尾の改行を取る
          end
        note: ブロック付きの File.open は、ブロックを抜けると自動でファイルを閉じる。
      - title: ファイルの存在確認
        code: |
          puts File.exist?("sample.txt")
          puts File.extname("note.txt")   # ".txt"
