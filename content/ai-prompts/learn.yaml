# AI への依頼文テンプレート: 学ぶ（形式は docs/09-v070-tools.md 4 章）
# 答えをそのまま求めず、ヒントや考え方を頼む言い方を選べるようにする（研修の方針）
version: 1
templates:
  - id: explain-concept
    category: learn
    title: 概念・仕組みを説明してほしい
    summary: 知らない言葉・仕組みを、自分のレベルに合わせて説明してもらう
    keywords: [説明, 概念, 仕組み, 学習, わからない, 勉強, たとえ, 入門]
    fields:
      - id: topic
        label: 知りたいこと
        type: text
        required: true
        placeholder: 例 Git のブランチとは何か。なぜ使うのか
        why: 知りたいことが具体的なほど、的を絞って説明してもらえる
      - id: level
        label: 自分の今のレベル
        type: select
        required: true
        why: レベルが分からないと、難しすぎる・簡単すぎる説明になる
        options:
          - { label: 初めて, value: この分野は初めてで、専門用語もほとんど知りません。 }
          - {
              label: 少し知っている,
              value: 基本は少し知っていますが、くわしくは理解できていません。,
            }
          - {
              label: ある程度知っている,
              value: ある程度知っていますが、仕組みの理由まで理解したいです。,
            }
      - id: why
        label: 何のために知りたいか
        type: text
        placeholder: 例 研修の課題で使うので、自分で説明できるようになりたい
        why: 目的が分かると、必要な深さと、省いてよい部分が決まる
      - id: form
        label: 説明の形
        type: select
        why: 自分に合う形（たとえ・図・例）だと、理解しやすい
        options:
          - { label: 指定なし, value: '' }
          - { label: たとえ話, value: 身近なものにたとえて説明してください。 }
          - { label: 図（文字で）, value: 図（文字で描いたもの）を使って説明してください。 }
          - { label: 例のコード, value: 短い例のコードを使って説明してください。 }
          - {
              label: 答えは言わずヒントで,
              value: 答えを先に言わず、考えるためのヒントと質問で導いてください。私が答えを求めたときに、答えを教えてください。,
            }
      - id: next
        label: 次に何を学べばよいかも知りたい
        type: checkbox
        text: 最後に、次に学ぶとよいこと（順番と理由）を教えてください。
        why: 学ぶ道筋が分かると、次の一歩を決めやすい
    output: |
      次のことについて、説明してください。

      ## 知りたいこと
      {{topic}}

      ## 自分の今のレベル
      {{level}}
      {{#why}}

      ## 何のために知りたいか
      {{why}}
      {{/why}}
      {{#form}}

      ## 説明の形
      {{form}}
      {{/form}}

      ## お願い
      - 私のレベルが分かりにくいときは、説明する前に質問してください。
      - 専門用語を使うときは、最初にその意味を短く説明してください。
      - 説明の最後に、理解できたか確かめる問いを 1〜2 個出してください。
      {{#next}}
      - {{next}}
      {{/next}}

  - id: explain-error
    category: learn
    title: エラーメッセージの意味を知りたい（答えではなくヒント）
    summary: エラーの意味と調べ方を教えてもらう。答えそのものではなく、考え方のヒントも選べる
    keywords: [エラー, エラーメッセージ, 意味, ヒント, 調べ方, 学習, 研修, 例外]
    fields:
      - id: message
        label: エラーメッセージ
        type: textarea
        required: true
        placeholder: エラーメッセージを全文貼る（個人情報・社内の名前は伏せる）
        why: メッセージの一部だけでは、似た別のエラーと取り違える
      - id: doing
        label: やろうとしていたこと
        type: textarea
        required: true
        placeholder: 例 ボタンを押したときに、入力した名前を画面に表示しようとしていた
        why: 何をしていたかが分からないと、メッセージの背景が分からない
      - id: tried
        label: 自分で調べたこと
        type: textarea
        placeholder: 例 メッセージの 3 行目を検索した。変数の名前を見直した
        why: 調べた内容を伝えると、重複せず、次の一歩を提案してもらえる
      - id: style
        label: 答え方
        type: select
        required: true
        why: 答えをそのまま聞くか、ヒントで自分で気づくかを選べる（学習が目的なら、ヒントがおすすめ）
        options:
          - {
              label: ヒントだけ（答えは言わない）,
              value: 直し方の答えそのものは書かず、原因を自分で調べるための手がかり（見る場所・調べ方・考え方）を、ヒントとして段階的に教えてください。答えは、私が求めるまで書かないでください。,
            }
          - {
              label: エラーの意味と原因の候補まで,
              value: エラーの意味と、考えられる原因の候補を教えてください。直したコードそのものは書かないでください。,
            }
          - {
              label: 意味と直し方まで,
              value: エラーの意味と、直し方（具体的な修正）まで教えてください。,
            }
    output: |
      次のエラーメッセージの意味を知りたいです。

      ## エラーメッセージ
      ```
      {{message}}
      ```

      ## やろうとしていたこと
      {{doing}}
      {{#tried}}

      ## 自分で調べたこと
      {{tried}}
      {{/tried}}

      ## 答え方
      {{style}}

      ## お願い
      - 情報が足りないときは、答える前に質問してください。
      - 専門用語を使うときは、最初にその意味を短く説明してください。
      - 次に自分で確かめる方法（どこを見る・何を調べる）も教えてください。
