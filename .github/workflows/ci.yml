name: CI

# PR 時に全テスト（L1〜L6）を実行し、スクリーンショット付きのテストレポートを残す。
# release.yml からも再利用ワークフローとして呼ばれる（PR とリリースで検証内容を同一にする）。
# 詳細: docs/04-test-strategy.md
on:
  pull_request:
    # main へのリリース PR と、統合ブランチ（verX_Y_Z）への機能の PR の両方で全テストを行う
    branches: [main, 'ver*']
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 雛形（package.json）作成前は後続ジョブをすべてスキップする
  pre:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json がないためテストをスキップします"
          fi

  # L1 ユニット / L2 コンテンツ検証 / L5 パッケージ検証 + vsix 作成
  build:
    needs: pre
    if: needs.pre.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: L1/L2 Unit & content tests
        run: npm test
      # チートシートのコード例を実際に実行するための処理系（Java は jshell を使う）
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: L2 Code snippets
        run: npm run test:snippets
      - name: Build & package vsix
        run: npm run package
      - name: L5 Package verification
        run: npm run test:package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-build
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # L3 Webview 画面テスト（スクリーンショット・ビジュアル回帰・アクセシビリティ）
  webview:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: L3 Webview tests
        run: npm run test:webview
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-webview
          path: test-results/
          if-no-files-found: ignore

  # L4 VS Code 統合テスト（最低対応バージョン・最新版 / Linux・Windows）
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vscode: 1.120.0
          - os: ubuntu-24.04
            vscode: stable
          - os: windows-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: L4 Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: L4 Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-integration-${{ matrix.os }}-${{ matrix.vscode }}
          path: test-results/
          if-no-files-found: ignore

  # L6 実機 E2E（作成した vsix を素の VS Code 1.120.0 にインストールして操作）
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VSCODE_TEST_VERSION: 1.120.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: .
      - run: npx playwright install --with-deps chromium
      - name: L6 E2E smoke tests
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-e2e
          path: test-results/
          if-no-files-found: ignore

  # まとめレポート（テストが失敗しても必ず実行して記録を残す）
  report:
    needs: [build, webview, integration, e2e]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: test-results/
          merge-multiple: true
      - name: Build summary report
        run: npm run test:report
      - name: Job summary
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-results/
          retention-days: 90
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\n\n詳細レポート（スクリーンショット付き）: [Artifacts の test-report](%s)\n' "$RUN_URL" >> test-results/summary.md
          gh pr comment "$PR" --body-file test-results/summary.md --edit-last \
            || gh pr comment "$PR" --body-file test-results/summary.md
      - name: Fail if any test job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
