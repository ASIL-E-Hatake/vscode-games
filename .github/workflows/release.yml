name: Release

# main へのマージ（push）時に全テストを再実行し、成功した場合のみリリースする。
# package.json の version に対応するタグ v<version> が未作成なら GitHub Release を作り、
# テスト済みの vsix とテストレポート（スクリーンショット付き）、vsix の SHA256SUMS と、その署名 SHA256SUMS.sig を添付する。
# 拡張機能のアップデート機能は SHA256SUMS で、ダウンロードした vsix が一致するか確かめてからインストールする
# （ファイル名 SHA256SUMS・形式 `sha256sum` の出力は src/features/updater/logic.ts と一致させる）。
# SHA256SUMS.sig は SHA256SUMS のバイト列に対する Ed25519 の署名（base64 の 1 行。scripts/sign-release.mjs）。
# 秘密鍵は Environment `release`（main からだけ使える）の secret RELEASE_SIGNING_KEY。空ならリリースを失敗させる。
# version を上げていない PR のマージではテストのみ行い、リリースはしない。
on:
  push:
    branches: [main]
  # 手動実行は main の再確認用（失敗したリリースのやり直しなど）。作業ブランチを選んで実行してもリリースはしない
  workflow_dispatch:

# 権限はジョブごとに最小にする
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    # ci.yml の report ジョブが求める権限（PR へのコメント。push では使わない）が上限になる
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  # リリースするかどうか（タグ v<version> が未作成か）を読み取り権限だけで調べる
  check:
    needs: test
    # main 以外（workflow_dispatch で作業ブランチを選んだとき）は、レビューを通っていない版になるためリリースしない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.ver.outputs.exists }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version tag
        id: ver
        run: |
          if [ ! -f package.json ]; then
            echo "exists=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION は既にリリース済みのためスキップします（リリースするには package.json の version を上げてください）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    # 署名の秘密鍵はこの Environment の secret（main からだけ使える設定。docs/03-development-rules.md 5.3）
    environment: release
    permissions:
      contents: write # タグと Release の作成
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 署名スクリプトは Node の crypto だけを使う（npm ci はしない）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # テスト済みの vsix・レポートをそのまま使う（再ビルドしない）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: test-report/

      - name: SHA256SUMS
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          (cd test-report && zip -qr "../release/test-report-v$VERSION.zip" .)
          # vsix の SHA256（アップデート機能が検証に使う。vsix は 1 つだけのはず）
          VSIX="hatake-gottani-$VERSION.vsix"
          if [ ! -f "release/$VSIX" ]; then
            echo "::error::release/$VSIX がありません"; ls release; exit 1
          fi
          (cd release && sha256sum *.vsix > SHA256SUMS && cat SHA256SUMS)

      # SHA256SUMS に署名し、同じスクリプトで公開鍵（秘密鍵から導く）で確かめる。鍵が空なら失敗（署名の無い版を出さない）
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          node scripts/sign-release.mjs sign release/SHA256SUMS
          node scripts/sign-release.mjs verify release/SHA256SUMS release/SHA256SUMS.sig

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # リリースノート = CHANGELOG のこの version の項目 + インストール方法 + テスト結果
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > changes.md
          {
            echo "## 変更内容"; cat changes.md; echo
            echo "## インストール"; echo
            echo "下の hatake-gottani-$VERSION.vsix をダウンロードし、次を実行します（VS Code 1.120 以上）。"; echo
            echo '```bash'; echo "code --install-extension hatake-gottani-$VERSION.vsix"; echo '```'; echo
            echo "v0.4.0 以降を使っている場合は、拡張機能の「更新を確認」（ホームのバージョン欄・コマンド「ごった煮: 更新を確認」）からも更新できます。"
            echo "SHA256SUMS は vsix のチェックサム、SHA256SUMS.sig はその署名です（拡張機能が更新時に検証に使います）。"; echo
            echo "## テスト結果"; echo; cat test-report/summary.md
          } > release-notes.md
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          # Immutable releases でも動くよう、下書き（draft）で作って添付ファイルをすべてそろえてから一度に公開する
          # （下書きの間はタグを作らない。公開した時点でタグ v<version> と添付ファイルが固定される）
          gh release create "v$VERSION" release/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            $PRERELEASE
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for f in "hatake-gottani-$VERSION.vsix" SHA256SUMS SHA256SUMS.sig "test-report-v$VERSION.zip"; do
            if ! printf '%s\n' "$ASSETS" | grep -qxF "$f"; then
              echo "::error::下書きの Release に $f がありません（公開しません）"; exit 1
            fi
          done
          gh release edit "v$VERSION" --draft=false
