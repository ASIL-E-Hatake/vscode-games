# エラーメッセージ辞書（Spring Boot の起動エラー）
# - patterns: 実際のメッセージに含まれる部分。貼り付けた文との照合に使う（長く一致したものほど上位）。
#   多くの起動エラーには「APPLICATION FAILED TO START」「Error creating bean with name」が一緒に出るため、
#   それぞれのエラーには、それより長くそのエラーにしか出ない部分を patterns に入れる
# - example: そのエラーが出る設定・コードの例（画面に出す）
# - spring: L2（npm run test:spring-errors）で実際に起動して確かめるときの壊し方（検査専用。画面と dist には出さない）。
#   tests/fixtures/spring-errors の小さなアプリ（Spring Boot 3.5・JPA・PostgreSQL / MySQL）に example を当てて起動し、
#   起動に失敗すること・出力に expect が含まれること・出力を貼り付けるとこのエラーが先頭に来ることを確かめる
#   - place: java は example をアプリのコードとして入れる（例ごとのパッケージ。package 文は検査が付ける）
#   - place: properties は example を application.properties として読む（base.properties の後に読む）
# - 研修方針により、直したコードそのものは載せない（意味・原因・確認ポイントまで）
version: 1
language: spring-boot
errors:
  # ---- 起動の失敗の読み方 ----
  - id: spring-boot-failed-to-start
    name: 'APPLICATION FAILED TO START（起動に失敗しました）'
    terms: [stack-trace, exception]
    patterns: ['APPLICATION FAILED TO START']
    summary: Spring Boot が起動の途中で止まった。原因が分かるときは、この見出しの下に「Description:（何が起きたか）」と「Action:（どうすればよいか）」が出る。
    causes:
      - 設定（application.properties / application.yml・環境変数）の誤り・書き忘れ
      - Bean（Spring が作って管理する部品）の作り方の誤り。同じ名前の Bean が 2 つある・必要な Bean が無い など
      - DB・ポートなど、アプリの外にあるものの準備ができていない
    checks:
      - '「Description:」の文を最初に読む。何が・どこで（クラス名・ファイル名）起きたかが書いてある'
      - '「Action:」に次にすることの手がかりがある。そのまま当てはまるとは限らないので、Description と合わせて考える'
      - この見出しが出ないときは、ログを上へさかのぼり、最初に出た ERROR と「Caused by:」の最後のものを探す
      - この辞書に、Description の文の一部を貼り付けて検索する
    example: |
      import org.springframework.context.annotation.Bean;
      import org.springframework.context.annotation.Configuration;

      @Configuration
      class ClockConfig {
        @Bean
        String greeting() { return "hello"; }
      }

      @Configuration
      class MessageConfig {
        // ほかの設定クラスと同じ名前（greeting）の Bean を作っている
        @Bean
        String greeting() { return "hi"; }
      }
    expect: APPLICATION FAILED TO START
    spring: { place: java }

  # ---- 設定・プロファイル ----
  - id: spring-boot-datasource
    name: 'Failed to configure a DataSource（DB の接続先がありません）'
    terms: [environment-variable]
    patterns: ['Failed to configure a DataSource', "'url' attribute is not specified"]
    summary: DB に接続する部品（DataSource）を作ろうとしたが、接続先の URL（spring.datasource.url）が設定されていない。
    causes:
      - spring.datasource.url を書いていない・キーの綴りが違う
      - 接続先をプロファイル用の設定ファイル（application-dev.properties など）にだけ書いていて、そのプロファイルが有効になっていない
      - 環境変数（SPRING_DATASOURCE_URL）で渡すつもりが、渡っていない（compose の environment・.env・IDE の実行構成）
      - DB を使わないアプリなのに、DB の依存（spring-boot-starter-data-jpa・jdbc）が入っている
    checks:
      - 起動ログの最初の方の「The following 1 profile is active」「No active profile set」で、有効なプロファイルを確かめる
      - 接続先を書いたファイル名と、有効なプロファイルの名前が合っているか確かめる
      - 環境変数で渡す場合は、コンテナ・実行構成で本当に設定されているか確かめる（docker compose config で中身を見られる）
    example: |
      # application.properties
      spring.application.name=demo
      # spring.datasource.url を書いていない
      # （application-dev.properties にだけ書いていて、dev のプロファイルが有効になっていない）
    expect: Failed to configure a DataSource
    spring: { place: properties, base: false }

  - id: spring-boot-bind-properties
    name: 'Failed to bind properties（設定の値を変換できません）'
    terms: [type]
    patterns: ['Failed to bind properties under']
    summary: 設定ファイルの値を、決まった型（数値・真偽値・時間など）に変換できなかった。
    causes:
      - 数値の設定に、単位や文字が付いている（ポート番号に「8080番」など）
      - properties ファイルの行の後ろにコメントを書いた（properties では「#」は行の先頭でだけコメントになり、行の途中の # からは値の一部になる）
      - YAML の字下げがずれて、別のキーの値になっている
      - 列挙（enum）の設定に、決められた以外の値を書いた
    checks:
      - '「Failed to bind properties under ''〇〇''」のキーと、その下の「Value:」（実際に読んだ値）・「Origin:」（どのファイルの何行目か）を見る'
      - 'Reason: に、どの型に変換しようとしたかが書いてある'
      - 環境変数・コマンドライン引数で同じキーを上書きしていないかも確かめる（Origin に出る）
    example: |
      # application.properties
      server.port=8080  # アプリのポート
    expect: Failed to bind properties under 'server.port'
    spring: { place: properties }

  - id: spring-boot-placeholder
    name: 'Could not resolve placeholder（設定のキーが見つかりません）'
    terms: [annotation, environment-variable]
    patterns: ['PlaceholderResolutionException', 'Could not resolve placeholder']
    summary: '@Value("${〇〇}") などで使っている設定のキーが、どの設定ファイル・環境変数にも無い。'
    causes:
      - キーをプロファイル用の設定ファイルにだけ書いていて、そのプロファイルが有効になっていない
      - キーの綴り・区切り（ハイフンとドット）が、設定ファイルとコードで違う
      - 環境変数で渡すつもりが、渡っていない
    checks:
      - メッセージの「placeholder '〇〇'」がキーの名前。設定ファイルを全文検索して、どのファイルに書いてあるか確かめる
      - 起動ログで有効なプロファイルを確かめる（The following 1 profile is active）
      - 'キーが無くても動かしたいときの書き方（既定値）は、公式ドキュメントの「@Value」を調べる'
    example: |
      import org.springframework.beans.factory.annotation.Value;
      import org.springframework.stereotype.Component;

      @Component
      class ApiClient {
        // app.api-url は application-dev.properties にだけ書いてある
        ApiClient(@Value("${app.api-url}") String apiUrl) {}
      }
    expect: Could not resolve placeholder 'app.api-url'
    spring: { place: java }

  - id: spring-boot-port-in-use
    name: 'Port 8080 was already in use（ポートが使われています）'
    terms: [port, process]
    patterns: ['Web server failed to start. Port', 'was already in use']
    summary: アプリが使おうとしたポート（既定は 8080）を、ほかのプログラムがもう使っている。
    causes:
      - 前に起動した同じアプリが、まだ動いている（IDE で停止し忘れた・ターミナルを閉じただけ）
      - ほかのアプリ・コンテナ（docker compose の ports）が同じポートを使っている
    checks:
      - 'どのプログラムがそのポートを使っているかを調べる（Linux コマンド辞書の「使用中のポートの確認」、Windows は netstat -ano）'
      - IDE の実行中のプログラムの一覧・docker ps を確かめる
      - 別のポートで起動したいときの設定のキー（server.port）を、公式ドキュメントで確かめる
    example: |
      # application.properties
      server.port=8080
      # （同じ PC で、前に起動したアプリがまだ 8080 番で動いている）
    expect: Port 8080 was already in use
    spring: { place: properties, occupyPort: 8080 }

  # ---- Bean（DI） ----
  - id: spring-boot-bean-creation
    name: 'BeanCreationException（Bean を作れません）'
    terms: [exception, annotation, class]
    patterns: ['BeanCreationException', 'Error creating bean']
    summary: Spring が Bean（@Component・@Service などを付けたクラスの部品）を作ろうとしたときに、例外が起きた。
    causes:
      - コンストラクタ・@PostConstruct のメソッドの中で例外が起きた（ファイルが無い・値の変換に失敗した など）
      - その Bean が使う別の Bean・設定が用意できなかった
    checks:
      - '「Error creating bean with name ''〇〇''」が、作れなかった Bean の名前（クラス名の先頭を小文字にしたもの）'
      - メッセージは「:」でつながっていて、後ろほど根本の原因。最後の「Caused by:」まで読む
      - 根本の原因の例外名（〇〇Exception）を、この辞書や Java のエラーで検索する
    example: |
      import java.nio.file.Files;
      import java.nio.file.Path;
      import org.springframework.stereotype.Component;

      @Component
      class PriceTable {
        PriceTable() throws Exception {
          // 起動したフォルダに prices.csv が無い
          Files.readAllLines(Path.of("prices.csv"));
        }
      }
    expect: Error creating bean with name 'priceTable'
    spring: { place: java }

  - id: spring-boot-no-such-bean
    name: 'NoSuchBeanDefinitionException（必要な Bean がありません）'
    terms: [annotation, class]
    patterns: ['NoSuchBeanDefinitionException', 'Consider defining a bean of type', 'that could not be found']
    summary: あるクラスがコンストラクタなどで受け取ろうとした型の Bean が、1 つも登録されていない。
    causes:
      - 受け取りたいクラス（実装クラス）に @Component・@Service・@Repository などを付け忘れた
      - そのクラスが、@SpringBootApplication を付けたクラスのパッケージの外（下にない）にあり、探す範囲に入っていない
      - 必要な依存（starter）が pom.xml / build.gradle に入っていない
    checks:
      - '「required a bean of type ''〇〇''」の型が、足りない Bean'
      - その型を実装したクラスに、@Component などが付いているか確かめる
      - そのクラスのパッケージが、@SpringBootApplication のクラスと同じか、その下にあるか確かめる
    example: |
      import org.springframework.stereotype.Service;

      interface PaymentClient {}

      // PaymentClient を実装したクラスに @Component などが付いていない
      class CardPaymentClient implements PaymentClient {}

      @Service
      class OrderService {
        OrderService(PaymentClient paymentClient) {}
      }
    expect: Consider defining a bean of type
    spring: { place: java }

  - id: spring-boot-no-unique-bean
    name: 'NoUniqueBeanDefinitionException（同じ型の Bean が 2 つ以上あります）'
    terms: [annotation, inheritance]
    patterns:
      ['NoUniqueBeanDefinitionException', 'expected single matching bean but found', 'required a single bean, but']
    summary: 受け取ろうとした型の Bean が 2 つ以上あり、どれを渡せばよいか Spring が決められない。
    causes:
      - 同じインターフェースを実装したクラスが 2 つ以上あり、どちらにも @Component などが付いている
      - 'ライブラリの自動設定が作る Bean と、自分で @Bean で作った Bean が同じ型'
    checks:
      - '「required a single bean, but 2 were found:」の下に、見つかった Bean の名前と定義した場所が並ぶ'
      - 'どれを使うかを指定する方法（@Primary・@Qualifier）を公式ドキュメントで調べる'
    example: |
      import org.springframework.stereotype.Component;
      import org.springframework.stereotype.Service;

      interface Notifier {}

      @Component
      class MailNotifier implements Notifier {}

      @Component
      class ChatNotifier implements Notifier {}

      @Service
      class SignupService {
        SignupService(Notifier notifier) {}
      }
    expect: required a single bean, but 2 were found
    spring: { place: java }

  - id: spring-boot-unsatisfied-dependency
    name: 'UnsatisfiedDependencyException（依存を渡せません）'
    terms: [exception, annotation, type]
    patterns: ['UnsatisfiedDependencyException', 'Unsatisfied dependency']
    summary: Bean を作るときに、コンストラクタの引数・フィールドに渡すもの（依存）を用意できなかった。何が足りないかは、メッセージの後ろに続く。
    causes:
      - 渡す Bean が無い・2 つ以上ある（NoSuchBeanDefinitionException・NoUniqueBeanDefinitionException）
      - 渡す Bean を作るときに例外が起きた
      - '@Value で受け取る設定の値を、引数の型に変換できない（数値の引数に「10s」など）'
    checks:
      - '「Unsatisfied dependency expressed through constructor parameter 0」は、何番目（0 から数える）の引数か・どのフィールドかを示す'
      - その後ろの「:」から先が理由。最後の部分を、この辞書で検索する
    example: |
      import org.springframework.beans.factory.annotation.Value;
      import org.springframework.stereotype.Component;

      @Component
      class RetryPolicy {
        // application.properties: app.retry-count=3回
        RetryPolicy(@Value("${app.retry-count}") int retryCount) {}
      }
    expect: Unsatisfied dependency expressed through constructor parameter 0
    spring: { place: java, properties: 'app.retry-count=3回' }

  - id: spring-boot-circular
    name: '循環参照（The dependencies of some of the beans form a cycle）'
    terms: [class, annotation]
    patterns:
      [
        'The dependencies of some of the beans in the application context form a cycle',
        'BeanCurrentlyInCreationException',
        'form a cycle',
      ]
    summary: Bean A が B を、B が A を（または A → B → C → A のように）受け取っていて、どちらも先に作れない。
    causes:
      - サービス同士が、お互いのメソッドを呼ぶために受け取り合っている
      - 設定クラス（@Configuration）の @Bean メソッドが、同じクラスの別の Bean を受け取っている
    checks:
      - 'メッセージの図（┌─────┐ の中）に、輪になっている Bean の名前と順番が出る'
      - 輪の中のクラスの役割を見直し、共通の処理を別のクラスに分けられないか考える
      - 循環参照を許す設定もあるが、Spring Boot 2.6 から既定で禁止になった理由を公式ドキュメントで確かめてから判断する
    example: |
      import org.springframework.stereotype.Service;

      @Service
      class OrderService {
        OrderService(StockService stockService) {}
      }

      @Service
      class StockService {
        StockService(OrderService orderService) {}
      }
    expect: The dependencies of some of the beans in the application context form a cycle
    spring: { place: java }

  # ---- DB への接続 ----
  - id: spring-boot-postgres-refused
    name: 'Connection to localhost:5432 refused（PostgreSQL に繋がりません）'
    terms: [port]
    patterns: ['Check that the hostname and port are correct', 'Connection refused']
    summary: PostgreSQL のサーバーに TCP で接続できなかった。指定したホスト・ポートで、PostgreSQL が待ち受けていない。
    causes:
      - PostgreSQL が起動していない（コンテナが止まっている・起動の途中）
      - アプリをコンテナで動かしているのに、接続先を localhost にしている（コンテナの中の localhost は、そのコンテナ自身）
      - ポート番号・ホスト名の誤り
    checks:
      - 'メッセージの「Connection to 〇〇:〇〇 refused」のホストとポートが、意図した接続先か確かめる'
      - docker compose ps で DB のコンテナが動いているか（healthy か）確かめる
      - compose の中から繋ぐときは、ホスト名を compose のサービス名にする（compose の組み立て・Docker 困ったとき辞書を参照）
    example: |
      # application.properties（アプリを compose のコンテナで動かしている）
      spring.datasource.url=jdbc:postgresql://localhost:5432/app
      spring.datasource.username=app
      spring.datasource.password=check-pass
    expect: Connection to localhost:5432 refused
    spring: { place: properties }

  - id: spring-boot-postgres-auth
    name: 'password authentication failed（PostgreSQL のパスワードが違います）'
    patterns: ['password authentication failed for user']
    summary: PostgreSQL には繋がったが、ユーザー名またはパスワードが違うため、ログインを断られた。
    causes:
      - spring.datasource.username / password が、DB に作ったユーザーと合っていない
      - .env・環境変数の値が渡っていない、または前の値のまま
      - 'DB のデータ（ボリューム）が前回のまま残っていて、POSTGRES_PASSWORD を変えても反映されていない（初回の起動のときだけ使われる）'
    checks:
      - メッセージの「for user "〇〇"」が、意図したユーザー名か確かめる
      - アプリに実際に渡っている値を確かめる（パスワードはログ・チャットに貼らない）
      - DB のコンテナのボリュームを作り直したかどうかを確かめる（Docker 困ったとき辞書の「データが残る」）
    example: |
      # application.properties
      spring.datasource.url=jdbc:postgresql://postgres:5432/app
      spring.datasource.username=app
      spring.datasource.password=wrong-pass
    expect: password authentication failed for user "app"
    spring: { place: properties }

  - id: spring-boot-postgres-no-database
    name: 'database "〇〇" does not exist（PostgreSQL のデータベースがありません）'
    patterns: ['PSQLException: FATAL: database "', 'FATAL: database "']
    summary: PostgreSQL にはログインできたが、接続先の URL に書いたデータベースが作られていない。
    causes:
      - URL の最後（/app の部分）のデータベース名の誤り
      - POSTGRES_DB で作ったデータベース名と、アプリの設定が違う
      - データベースを作る初期化 SQL が実行されていない
    checks:
      - メッセージの「database "〇〇"」と、URL のデータベース名・POSTGRES_DB を見比べる
      - psql で \l を実行して、あるデータベースの一覧を確かめる
    example: |
      # application.properties
      spring.datasource.url=jdbc:postgresql://postgres:5432/shop
    expect: database "shop" does not exist
    spring: { place: properties }

  - id: spring-boot-mysql-communications
    name: 'Communications link failure（MySQL に繋がりません）'
    terms: [port]
    patterns:
      ['The driver has not received any packets from the server', 'Communications link failure']
    summary: MySQL のサーバーと通信できなかった。指定したホスト・ポートで MySQL が待ち受けていない、または途中で切れた。
    causes:
      - MySQL が起動していない・起動の途中（MySQL は初回の起動に時間がかかる）
      - アプリをコンテナで動かしているのに、接続先を localhost にしている
      - ポート番号・ホスト名の誤り
    checks:
      - URL のホストとポートが、意図した接続先か確かめる
      - docker compose ps で DB のコンテナが healthy になっているか確かめる（compose の depends_on と healthcheck）
      - '「The last packet sent successfully to the server was 0 milliseconds ago」は、一度も繋がらなかったことを示す'
    example: |
      # application.properties（アプリを compose のコンテナで動かしている）
      spring.datasource.url=jdbc:mysql://localhost:3306/app
      spring.datasource.username=app
      spring.datasource.password=check-pass
    expect: Communications link failure
    spring: { place: properties }

  - id: spring-boot-mysql-access-denied
    name: 'Access denied for user（MySQL のパスワードが違います）'
    patterns: ['SQLException: Access denied for user', 'Access denied for user']
    summary: MySQL には繋がったが、ユーザー名・パスワード・接続元の組み合わせが許可されていないため、ログインを断られた。
    causes:
      - spring.datasource.username / password が、DB に作ったユーザーと合っていない
      - 'DB のデータ（ボリューム）が前回のまま残っていて、MYSQL_PASSWORD を変えても反映されていない（初回の起動のときだけ使われる）'
      - ユーザーに、そのデータベースを使う権限が無い
    checks:
      - メッセージの「for user '〇〇'@'〇〇'」が、意図したユーザー名か確かめる（@ の後ろは接続元）
      - アプリに実際に渡っている値を確かめる（パスワードはログ・チャットに貼らない）
      - DB のコンテナのボリュームを作り直したかどうかを確かめる
    example: |
      # application.properties
      spring.datasource.url=jdbc:mysql://mysql:3306/app
      spring.datasource.username=app
      spring.datasource.password=wrong-pass
    expect: Access denied for user 'app'
    spring: { place: properties }

  - id: spring-boot-mysql-unknown-database
    name: 'Unknown database（MySQL のデータベースがありません）'
    patterns: ['SQLSyntaxErrorException: Unknown database', 'Unknown database']
    summary: MySQL にはログインできたが、接続先の URL に書いたデータベースが作られていない。
    causes:
      - URL の最後（/app の部分）のデータベース名の誤り
      - MYSQL_DATABASE で作ったデータベース名と、アプリの設定が違う
    checks:
      - 'メッセージの「Unknown database ''〇〇''」と、URL のデータベース名・MYSQL_DATABASE を見比べる'
      - mysql コマンドで SHOW DATABASES; を実行して、あるデータベースの一覧を確かめる
    example: |
      # application.properties
      spring.datasource.url=jdbc:mysql://mysql:3306/shop
      spring.datasource.username=root
      spring.datasource.password=root-check-pass
    expect: Unknown database 'shop'
    spring: { place: properties }

  # ---- 版・依存 ----
  - id: spring-boot-class-not-found
    name: 'ClassNotFoundException / NoClassDefFoundError（クラスが見つかりません・依存の版ずれ）'
    terms: [class, package-manager, jvm]
    patterns: ['NoClassDefFoundError', 'ClassNotFoundException']
    summary: コンパイルのときにはあったクラスが、実行のときに見つからない。依存ライブラリの版が合っていないときによく起きる。
    causes:
      - Spring Boot 3 は jakarta.* のクラスを使うが、古いライブラリ・コードが javax.* のクラスを使っている（Spring Boot 2 からの移行）
      - 依存の版を個別に指定していて、Spring Boot が決めた版と合っていない
      - 依存のスコープ（provided・test）のため、実行時のクラスパスに入っていない
    checks:
      - メッセージの見つからないクラス名（javax/servlet/Filter など）が、どのライブラリのものか調べる
      - 依存の木を表示して（コマンド組み立ての Maven / Gradle タブ）、そのライブラリの版と、誰が持ち込んだかを確かめる
      - 版を個別に指定している依存がないか、pom.xml / build.gradle を確かめる
    example: |
      import java.io.IOException;
      import javax.servlet.Filter;
      import javax.servlet.FilterChain;
      import javax.servlet.ServletException;
      import javax.servlet.ServletRequest;
      import javax.servlet.ServletResponse;
      import org.springframework.stereotype.Component;

      // Spring Boot 2 の頃に書いたフィルター（javax.servlet）を、Spring Boot 3 のアプリにそのまま入れた
      @Component
      class LegacyFilter implements Filter {
        public void doFilter(ServletRequest req, ServletResponse res, FilterChain chain)
            throws IOException, ServletException {
          chain.doFilter(req, res);
        }
      }
    expect: 'ClassNotFoundException: javax.servlet.Filter'
    spring: { place: java }

  - id: spring-boot-unsupported-class-version
    name: 'UnsupportedClassVersionError（Java の版が古いです）'
    terms: [jdk, jvm, compile]
    patterns: ['UnsupportedClassVersionError', 'has been compiled by a more recent version of the Java Runtime']
    summary: 新しい Java でコンパイルしたクラスを、それより古い Java で実行しようとした。
    causes:
      - ビルドは Java 21（pom.xml の java.version・Gradle の toolchain）なのに、実行する PC・サーバー・コンテナの Java が 17 など古い
      - 'PATH・JAVA_HOME で、意図しない古い Java が使われている'
      - Dockerfile のビルド用と実行用のイメージで、Java の版が違う
    checks:
      - '「class file version 65.0」と「up to 61.0」の数字で、ビルドと実行の Java の版が分かる（65 = Java 21、61 = Java 17。数字から 44 を引くと Java の版）'
      - 実行する環境で java -version を実行して確かめる
      - サーバーの Java を上げる手順は、実行環境・サーバー構築ガイドを参照
    example: |
      # ビルド: Java 21（pom.xml の <java.version>21</java.version>）
      # 実行: サーバーの Java は 17
      $ java -version
      openjdk version "17.0.12"
      $ java -jar app.jar
    expect: UnsupportedClassVersionError
    spring: { place: none, java: '17' }
