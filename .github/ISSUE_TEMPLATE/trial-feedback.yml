name: 試用フィードバック
description: 使ってみた感想・困ったこと・ほしいものを気軽に送る
title: '[試用] '
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: 試用に協力いただきありがとうございます。分かる範囲で書いてください（空欄があっても大丈夫です）。
  - type: dropdown
    id: feature
    attributes:
      label: 機能
      multiple: true
      options:
        - 全体
        - ホーム
        - はじめての VS Code
        - Linux コマンド辞書
        - 言語別チートシート
        - リンク集
        - コードタイピング
        - 反射神経テスト
        - スライドパズル
  - type: textarea
    id: feedback
    attributes:
      label: 感想・困ったこと・ほしいもの
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境（OS / VS Code のバージョン / テーマ）
      placeholder: 例) Windows 11 / VS Code 1.120.0 / Dark Modern
  - type: input
    id: version
    attributes:
      label: 拡張機能のバージョン
      placeholder: 例) 0.1.0
