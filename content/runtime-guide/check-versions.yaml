    url: https://tomcat.apache.org/security-10.html
  - title: Nginx のセキュリティ情報
    url: https://nginx.org/en/security_advisories.html
  - title: Spring のセキュリティ情報
    url: https://spring.io/security
  - title: Red Hat のセキュリティ更新
    url: https://access.redhat.com/security/security-updates/
  - title: Amazon Linux 2023 のセキュリティアドバイザリ（ALAS）
    url: https://alas.aws.amazon.com/alas2023.html
  - title: OWASP Dependency-Check
    url: https://owasp.org/www-project-dependency-check/
